[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kotlin1-python-service"
version = "0.1.0"
description = "Independent Python HTTP service used by the Kotlin1 application group"
requires-python = ">=3.10"
dependencies = [
    "py-lib1==0.1.0",
    "py-lib-2==0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
